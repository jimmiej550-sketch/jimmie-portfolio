<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Buy Phones</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="page-shell">
    <section class="product-page">
      <h1>Mockup of Premium Phones</h1>
      <p>Here is a simple product-style page inspired by modern phone showcases.</p>

      <div class="phone-grid">
        <div class="phone-card">
          <div class="phone-screen"></div>
          <h3>Midnight Pro</h3>
          <p>6.7-inch display · A18 chip · 256GB</p>
        </div>

        <div class="phone-card">
          <div class="phone-screen alt"></div>
          <h3>Silver Air</h3>
          <p>6.1-inch display · A18 chip · 128GB</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
